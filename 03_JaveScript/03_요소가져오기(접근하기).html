<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요소 가져오기</title>

    <style>
        .area{
            border: 1px solid black;
            width: 300px;
            height: 100px;
        }




    </style>
</head>
<body>

    <h1>HTML 요소에 접근하기(해당 요소객체 가져오기)</h1>

    <h3>1) 아이디를 이용해서 요소 가져오기</h3>
    <div id="area1" class="area"></div>
    <button onclick="acessId()">아이디로 접근</button>
    <script>
        function acessId(){
            //아이디로 요소 가져올 때
            //document.getElementById("아이디명");
            var area1 = document.getElementById("area1")

            // 선택한 요소의 속성값가져온가더나 변경 가능
            // 속성에 접근하고자 할 때 => 선택한요소.접근하고자하는속성명
            area1.innerHTML +="아이디로 접근 성공!<br>"
            
            // 선택된 요소의 스타일 변경
            area1.style.backgroundColor = "pink";
            area1.style.color = "red";
            area1.style.width = "200px";
            area1.style.height = "200px";

        }

    </script>

    <br><br>

    <div id="area2" class="area" style="background-color: red;"></div>
    <button onclick="changeColor()">클릭마다 색 변경</button>
    
    <script>
        function changeColor(){
            var area2 = document.getElementById("area2");
        //console.log(area2.style.backgroundColor) //아레아2의 배경색을 알아내기

            if(area2.style.backgroundColor == "red"){
                area2.style.backgroundColor  = "yellow"
            }else{
                area2.style.backgroundColor = "red"

            }
        }

    </script>
    <br>

    <h3>2) 태그명을 이용해서 요소 가져오기</h3>
    <ul>
        <li>목록1</li>
        <li>목록2</li>
        <li>목록3</li>
        <li>목록4</li>
        <li>목록5</li>
    </ul>

    <button onclick="accessTagName()">태그명으로 접근</button>
    <script>
        function accessTagName(){

            //태그명으로 요소 가져올 때:s
            // document.getElementsByTagName("태그명")
            // =>선택된 요소 객체들이 배열(나란히있는여러박스.0번부터넘버링01234)에 담겨서 반환!
                                                    //*li는 태그인데 자스는 문자열로!!
            var list = document.getElementsByTagName("li"); // => [li요소,li요소,...]
            console.log(list); // [li,li,li,li,li]0,1,2,3,4번 인덱스 길이는 총 5다
            console.log("배열의 크기 : " + list.length);
            //박스자리 지정- 0 : 첫번째li
            console.log(list[0]) // 가장 첫번째 요소 0을 가리키는 인덱스를 보여달라는 의미
            
        //list[0].innerHTML = "안녕하세요";

            var blueColor = 50;
            for(var i=0; i<list.length; i++){//i의 값은 0,1,2,3,4
                list[i].innerHTML="안녕하세요";
            //list[i].style.backgroundColor="yellow"
                list[i].style.backgroundColor="rgb(130,220," + blueColor + ")"; 
                blueColor += 50;
            }

        }

    </script>

    <br>

    <h3>3) name 속성값을 이용해서 요소를 가져오기</h3>

    <form action="">
        <fieldset>
            <legend>취미</legend>
            <input type="checkbox" name="hobby" id="game" value="game">
            <label for="game">게임</label>

            <input type="checkbox" name="hobby" id="movie" value="movie">
            <label for="movie">영화</label>

            <input type="checkbox" name="hobby" id="reading" value="reading">
            <label for="reading">독서</label>

            <input type="checkbox" name="hobby" id="sports" value="sports">
            <label for="sports">운동</label>  
        </fieldset>


    </form>

    <br>
    <div class="area" id="area3"></div>
    <button onclick="accessName()">name으로 접근</button>
    <script>
        function accessName(){
            // name 속성값으로 요소 가져오기
            // document.getElementsByName("name 속성값") =>선택된 요소들이 배열에 담겨서 반환
            var hobby = document.getElementsByName("hobby");//네임이 하비인 거 싹 다 가져올거
            // [input, input, ...] [0,1,2,3,...]
        //console.log(hobby)
            for(var i=0 ; i<hobby.length; i++){ 
        //console.log(hobby[i].checked)
            if(hobby[i].checked == true){ // 만약 i번째 체크박스가 체크되엉ㅆ으면
                    //console.log(hobby[i].value)
                    document.getElementById("area3").innerHTML += hobby[i].value + "<" //=으로 하면 누적안됨
                    //=area3.innerHTML +=hobby[i].valuse +"<br>"
                    

                }

            }

        }

    </script>

    <h3>5) 내가 원하는 요소 자유자재로 가져오기 (선택자를 활용)</h3>
    <div id="test1">테스트 입니다.</div>
    <div class="test">
        <h2>안녕</h2>
        <h2>잘가</h2>
        </div>
    <span>ㅋㅋㅋ</span>
    <h2>빠이</h2>

    <br>
    <button onclick="accessSelector()">클릭</button>
    <script>
        function accessSelector(){
            // 선택자를 이용해서 요소를 가져오고자 할 때
            // document.querySelector("선택자") => 선택된 요소 객체 하나만 반환
            // document.querySelectorAll("선택자") => 선택된 요소 객체들을 배열에 담아서 반환

            //선택하라
            var divEl = document.querySelector("#test1"); //div 요소 객체
            var h2El = document.querySelectorAll(".test>h2") //배열[h2요소객체, h2요소객체]
            var spanEl = document.querySelector(".test+span"); //span요소 객체 선택

            console.log(divEl.innerHTML);

            for(var i=0; i<h2El.length; i++) {
                console.log(h2El[i].innerHTML);
            }
            
            console.log(spanEl.innerHTML);
            //console.log(h2El); 

        }

    </script>
