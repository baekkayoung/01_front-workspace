            * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: whitesmoke;
        color: rgb(78, 62, 62);
        line-height: 1.6;
        padding: 20px;
        }

        header {
        text-align: center;
        background-color: ghostwhite;
        color:gray;

        border-radius: 40px;

        header h1 {

        display: inline-block;

        main {

        .skill-box span {

        color: #4a4946;
        padding: 10px 15px;
        border-radius: 6px;
        font-weight: bold;
        border: 1px solid #a2a4ad;

        .project ul {

        }

        .project a {

        text-decoration: none;

        .project a:hover {

        margin-top: 40px;

        background-color: #e5e7eb;
