<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열</title>
    <style>
        .area {border: 1px solid red;}
        .small{height: 100px;}
        .big{height: 200px;}
    </style>
</head>
<body>
    <h1>배열</h1>
    <p>
        변수 선언시 별도의 자료형 지정이 없기 때문에<br>
        어떤 자료형의 값들이든 다 하나의 공간에 담을 수 있음.
        크기의 제약도 없음
    </p>

    <button onclick="arrayTest1()">확인하기</button>
    <div id="area1" class="area small"></div>

    <script>
        function arrayTest1(){
            const arr = ["박보검", '서울', 20, true, [1,2,3] ]// 배열 안에 또 배열 담을 수 있음
            
            console.log(arr)
            console.log(arr[2]) // 2번째
            console.log(arr[4][2]) // 선택 가능 

            const area1 = document.getElementById("area1");
            /*
            for(let i=0; i<arr.length; i++){
                area1.innerHTML += arr[i] + "<br>" // 모든 항목이 나옴
            }
            */
           
            // 배열의 0번 인덱스부터 마지막 인덱스까지
            // 순차적으로 모든 요소에 접근할 목적이라고 한다면..
            // for in문 활용 가능
            // for(let 변수 in 내가 순차적으로 접근할 배열 이름){}
            for(let i in arr){ // i=0 => i=1 => i+2 => ...
                area1.innerHTML += arr[i] + "<br>" 
                // 모든 항목이 나옴 마지막까지 접근할 목적이라 몇 까지? 이런거 안 됨 끝까지 가야 함


            }
        }



    </script>

    
</body>
</html>
