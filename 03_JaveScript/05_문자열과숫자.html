<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열과숫자</title>

    <style>
        .area {
        width: 300px;
        border: 1px solid black;}

        .small{height: 200px;}
        .big{height: 450px;}

    
    </style>
</head>
<body>

    <h1>문자열과 숫자</h1>

    <h3>* 문자열 관련 기본 메소드</h3>
    <button onclick="stringTest()">문자열 처리 메소드</button>
    <div id="area1" class="area big"></div>
    <script>
        function stringTest (){
            const area1 = document.getElementById("area1"); // div 요소 객체
            
            const str1= "Hello World"
            area1.innerHTML = "str1:" + str1 + "<br>"
            area1.innerHTML += "toUpperCase()" + str1.toUpperCase() + "<br>"
            area1.innerHTML += "toLowerCase()" + str1.toLowerCase() + "<br>"

            area1.innerHTML += "문자열의 길이 : " + str1.length + "<br>"

            area1.innerHTML += "두번째 자리 글자 : "  + str1.charAt(1) +"<br>"
                                                    //0번부터라 2번 원하면 1
            for(let i=0; i<str1.length; i++){
                area1.innerHTML += i + "번째 인덱스: " + str1.charAt(i) +"<br>"
            }                 

            area1.innerHTML += "앞에서 부터 첫 l의 위치: " + str1.indexOf("l") + "<br>"
            area1.innerHTML += "뒤에서 부터 첫 l의 위치: " + str1.lastIndexOf("l") +"<br>"
            area1.innerHTML += "앞에서 부터 첫 a의 위치: " + str1.indexOf("a") +"<br>"
            //해당 문자가 존재하지 않을 경우 -1을 반환 /문자가 있으면 위치 반환

            area1.innerHTML += "substring(시작인덱스)" + str1.substring(6) + "<br>"
            area1.innerHTML += "substring(시작인덱스, 골인덱스)" + str1.substring(0,3) + "<br>"
            // 바로 앞까지

            const str2 ="사과,바나나,복숭아,키위"
            const fruits = str2.split(",") //, 사라짐
            

            area1.innerHTML += "fruits : " + fruits + "<br>"
            area1.innerHTML += "frurits의 자료형:" + typeof(fruits) + "<br>"
            console.log(fruits);

            // 내재적으로 가지고 있는 건 메소드, 내가 만든 건 함수

        }
        

    </script>

    <h3>* 문자열 관련 html 메소드</h3>

    <button onclick="stringHtmlTEst()"> 문자열 html 메소드</button>
    <div id="area2" class="area big"></div>

    <script>
        function stringHtmlTEst(){
            const area2 = document.getElementById("area2")

            const str = "javascript"
            area2.innerHTML = "str : " + str + "<br>"
            area2.innerHTML += "bold() : " + str.bold() + "<br>" // bold
            area2.innerHTML += "italics(): " + str.italics() + "<br>" // i
            area2.innerHTML += "small() : " + str.small() + "<br>" //small
            area2.innerHTML += "sub() :  " + str.sub() + "<br>" //sub 아래첨자
            area2.innerHTML += "sup() :  " + str.sup() + "<br>" //sup 아래첨자

            area2.innerHTML += "link() : " + str.link("http://www.naver.com ") + "<br>" // a
         }

    </script>

    <hr>
    
    <h3>* 숫자(수학) 관련 메소드</h3>
    <button onclick="mathTest()">수학 관련 메소드</button>
    <div id="area3" class="area small"></div>

    <script>

        function mathTest(){
            const area3 = document.querySelector("#area3");

            // 자바스크립트에서 math 내장 객체 제공
            area3.innerHTML = "절대값 : " +Math.abs(-123)+ "<br>"
            area3.innerHTML += "랜덤값 : " +Math.random() + "<br>"
            area3.innerHTML += "반올림 :" +Math.round(123.658) + "<br>" // 가장 가까운 정수값
            area3.innerHTML += "버림 : " +Math.floor(123.678) +"<br>"
            area3.innerHTML += "올림 : " +Math.ceil(123.123)
        }

    </script>

    <hr>

    <h3>* 문자들과 숫자간의 산술 연산 / 형변환</h3>
    <button onclick="arithmetic()">산술 연산</button>
    <div id="area4" class="area big"></div>

    <script>
        function arithmetic(){
            const test1 = 7 + 7; // 14
            const test2 = 7 + "7"; // "77"
            const test3 = "7" + 7; // "77"
            const test4 = "7"+ 7 + 7; // "777"
            const test5 = "7" + (7+7); // "714"

            //타언어에서는 "7"-7 => 오류(*,/ 마찬가지)

            // 덧셈 외 빼기, 곱하기, 나누기는 산술 연산 가능!
            // 문자열이 자동 형변환 돼서 숫자로 변환된 뒤 산술 연산됨!
            // 단, 문자열에는 숫자만 존재해야됨
            const test6 = "7" - 7; // 0
            const test7 = "7" * 7; //49
            const test8 = "7" / 7; // 1

            const area4 = document.querySelector("#area4")
            area4.innerHTML ="test6: " + test6 + "<br>"
            area4.innerHTML +="test7: " + test7 + "<br>"
            area4.innerHTML +="test8: " + test8 + "<hr>"     
            
            
            // 덧셈연산시에는 자동 형변환이 되지 않고 연이어서 하나의 문자열로 됨
            // 강제로 형변환 (문자열 => 숫자)
            // 1) Number(문자열) // 첫 이니셜이 대문자: 생성자 함수
            // 2) parseInt(문자열) => 문자열이 정수일 때
            // 3) parseFloat(문자열) => 문자열이 실수(소수)일 때

            // 2, "3" 덧셈연산
            const test9 = 2 + "3" ; // "23"

            const test10 = 2 + Number("3"); // 5
            const test11 = 2 + parseInt("3"); //5
            const test12 = 2 + parseFloat("3"); //5

            area4.innerHTML += "test10 : " + test10 + "<br>"
            area4.innerHTML += "test11 : " + test11 + "<br>"
            area4.innerHTML += "test12 : " + test12 + "<hr>"

            // 2, "1.234" 덧셈 연산

            const test13 = 2 + "1.234" ; // "21.234"

            const test14 = 2 + Number("1.234"); // 3.234
            const test15 = 2 + parseInt("1.234"); // "1.234" => "1"
            const test16 = 2 + parseFloat("1.234"); // "1.234" => 1.234

            area4.innerHTML += "test14 : " + test14 + "<br>"
            area4.innerHTML += "test15 : " + test15 + "<br>" //정수용이라 나머지 떨어지고 1. 1+2 =3
            area4.innerHTML += "test16 : " + test16 + "<hr>"

           
        }

    </script>


    <!-- 언제 강제형변환 해야하나? => 계산기 같은 거 무조건 문자열로 가지고 오게 됨-->
    정수1: <input type="number" id="num1"><br>
    정수2: <input type="number" id="num2"><br>

    <div id="result">결과 없음</div>
    <button onclick="plus()">덧셈</button>

    <script>
        function plus(){
            // 인풋요소의 value 값은 무조건 문자열로 옴
            const num1 = document.getElementById("num1").value // "10" 
            const num2 = document.getElementById("num2").value // "20"

            //const sum = num1 + num2; // "10" +"20" =>"1020"
            const sum = Number(num1) + Number(num2);
            
            document.getElementById("result").innerHTML = "결과: " +  sum;

        
        }


    </script>
</body>
</html>
