<!DOCTYPE html>
<html lang="en">

        .area{

<body>

    <h1>정규표현식을 활용한 회원가입 폼</h1>

    <form action="test.do" method="get">
        <div id="area1" class="area">
            <br>
            *아이디 :
            <input type="text" name="userId" id="userId" required><br>
            <label>첫 글자는 반드시 영문자로, 그리고 영문자, 숫자를 포함하여 총 4~12자로 입력하시오</label>

            <br><br>

            *비밀번호 확인 :
            <input type="password" id="userPwd2" required>
            <label>위의 비밀번호와 일치하게 입력하시오</label>
            <br><br>

            *이름 :
            <input type="text" name="userName" id="userName" required><br>
            <label>한글로만 이루어져야되며 2글자 이상으로 입력하시오</label>
            <br><br>

            *이메일 : 
            <input type="email" name="email" id="email"><br>
            <label>이메일 형식에 맞춰서 입력하시오</label>
            <br><br>

            *취미 :
            <select name="hobby" id="hobby">
                <option value="soccer">축구</option>
                <option value="baseball">야구</option>
                <option value="basketball">농구</option>
                <option value="running">러닝</option>
            </select>
            <br><br>

            *거주지
            <select name="address" id="adress">
                <option value="seoul">서울</option>
                <option value="incheon" selected>인천</option>
                <option value="busan">부산</option>
            </select>
            <br><br>

            <input type="submit" value="회원가입" onclick="return validate()">
            <input type="reset" value="취소">


        </div>
    </form>
