<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종합실습문제3</title>
</head>
<body>
   
    <h2>회원가입</h2>
    
    <form action="test.do">
    <fieldset>
        <fieldset>
            <legend>필수 입력 사항</legend>
            <table border="0">
                <tr>
                    <th>ID</th>
                    <td><input type="text" name="id" placeholder="아이디 10글자 이내" size="28" maxlength="10"> &nbsp;<input type="button" name="button" value="중복확인"></td>
                </tr>

                <tr>
                    <th>비밀번호</th>
                    <td><input type="password" name="password" placeholder="영문, 숫자, 특수문자 포함 8자 이상" size="28" minlength="8"> <br></td>
                </tr>

                <tr>
                    <th>비밀번호 확인</th>
                    <td><input type="password" name="password2" size="28" minlength="8"></td><br>
                </tr>

                <tr>
                    <th>Email</th> 
                    <td><input type="text" name="email" size="28" >&nbsp;<select name="mail"> 
                <option value="naver">@naver.com</option>
                <option value="gmail">@gmail.co</option>
                <option value="icloud">@icloud.com</option>
                <option value="nate.com">@nate.com</option>
                <option value=""selected>직접입력</option>

            </select></td>
                </tr>
            </table>

        </fieldset>

        <fieldset>
            <legend>추가 정보</legend>
            프로필 사진 : 
            <input type="file" name="img"><br><br>

            성별 : 
            <input type="radio" name="gender" value="M" id="radioM">남자
            <label for="radioM"></label>
            &nbsp;
            <input type="radio" name="gender" value="F" id="radioF">여자
            <label for="radioF"></label>

            <br><br>

            생년월일 : 
            <input type="date" name="birth">

            <br><br>
            
            취미
            <br>
            <input type="checkbox" name="hobby" id="baseball" value="baseball" >
            <label for="baseball">야구</label>
        
            <input type="checkbox" name="hobby" id="basketball" value="basketball">
            <label for="basketball">농구</label>

            <input type="checkbox" name="hobby" id="soccer" value="soccer">
            <label for="soccer">축구</label> <br>
            
            <input type="checkbox" name="hobby" id="study" value="study">
            <label for="study">공부</label>

            <input type="checkbox" name="hobby" id="music" value="music">
            <label for="music">음악감상</label><br>

            <input type="checkbox" name=""> 기타 :  <input type="text">
            <br><br>

            자기소개<br>
            <textarea name="content" id="" cols="35" rows="5" style="resize: none;"></textarea>


        </fieldset>
        <br>
        <br>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <input type="submit" name="submit" value="회원가입">
        <input type="reset" name="reset">
        <input type="button"name="button" value="이전으로">

        </form>
    </fieldset>
    
</body>
</html>
