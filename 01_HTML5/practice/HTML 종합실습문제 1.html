<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종합실습문제1</title>
</head>
<body>
    <form action="test.do">

    고객명 : <input type="text" name="name"><br><br>
    전화번호 : <input type="phone" name="phone"><br><br>
    E-mail : <input type="email" name="email"><br><br>
    <fieldset>
        <legend>피자 사이즈</legend>
        <input type="radio" name="size" id="sizeS" value="S">
        <label for="sizeS">Small</label><br><br>
        <input type="radio" name="size" id="sizeM" value="M">
        <label for="sizeM">Medium</label><br><br>
        <input type="radio" name="size" id="sizeL" value="L">
        <label for="sizeL">Large</label><br><br>
    </fieldset>
    <br>
    <fieldset>
        <legend>토핑 선택</legend>
        <input type="checkbox" name="topping" id="bacon" value="bacon">
        <label for="bacon">베이컨</label><br><br>
        
        <input type="checkbox" name="topping" id="cheese" value="chesee">
        <label for="cheese">치즈</label><br><br>

        <input type="checkbox" name="topping" id="onion" value="onion">
        <label for="onion">양파</label><br><br>

        <input type="checkbox" name="topping" id="mushroom" value="mushroom">
        <label for="mushroom">버섯</label><br><br>


    </fieldset>
    <br>
    희망 배송 시간 : 
    <input type="time">
    <br><br>
    배송 시 요청 사항 : <textarea name="ask"></textarea>
    <br><br>
    <input type="submit" value="주문하기">
    </form>

    
</body>
</html>
