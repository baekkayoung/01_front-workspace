<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .demo-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 20px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }

        .demo-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        /* 모달 오버레이 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 모달 창 */
        .modal {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.8) translateY(50px);
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        /* 모달 헤더 */
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #1f2937;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #6b7280;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background-color: #f3f4f6;
            color: #374151;
        }

        /* 모달 내용 */
        .modal-body {
            padding: 24px;
        }

        /* 입력 그룹 */
        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .input-container {
            position: relative;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-field:disabled {
            background-color: #f9fafb;
            color: #6b7280;
            cursor: not-allowed;
        }

        .input-field.verified {
            border-color: #10b981;
            background-color: #f0fdf4;
        }

        /* 인증 관련 스타일 */
        .verification-group {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .verification-input {
            flex: 1;
        }

        .verify-btn, .send-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .verify-btn:hover, .send-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .verify-btn:disabled, .send-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        /* 타이머 스타일 */
        .timer {
            font-size: 14px;
            color: #ef4444;
            font-weight: 500;
            margin-top: 4px;
        }

        /* 비밀번호 입력 필드 */
        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .password-toggle:hover {
            background-color: #f3f4f6;
            color: #374151;
        }

        /* 인증 완료 표시 */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #d1fae5;
            color: #065f46;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 16px;
            margin-top: 4px;
        }

        /* 에러 메시지 */
        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 4px;
        }

        /* 제출 버튼 */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .submit-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 비활성화된 섹션 */
        .disabled-section {
            opacity: 0.5;
            pointer-events: none;
        }

        /* 안내 텍스트 */
        .info-text {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* 애니메이션 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body>
    <button class="demo-button" onclick="openModal()">비밀번호 찾기</button>

    <!-- 모달 오버레이 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <!-- 모달 헤더 -->
            <div class="modal-header">
                <h2 class="modal-title">비밀번호 찾기</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <!-- 모달 내용 -->
            <div class="modal-body">
                <p class="info-text">
                    사번과 전화번호를 입력하여 본인 인증을 완료한 후, 새로운 비밀번호를 설정하세요.
                </p>

                <!-- 사번 입력 -->
                <div class="input-group">
                    <label class="input-label">사번</label>
                    <input type="text" class="input-field" id="employeeId" placeholder="사번을 입력하세요">
                    <div class="error-message" id="employeeIdError"></div>
                </div>

                <!-- 전화번호 입력 -->
                <div class="input-group">
                    <label class="input-label">전화번호</label>
                    <div class="verification-group">
                        <div class="verification-input">
                            <input type="tel" class="input-field" id="phoneNumber" placeholder="010-0000-0000">
                        </div>
                        <button class="send-btn" id="sendBtn" onclick="sendVerification()">인증번호 발송</button>
                    </div>
                    <div class="error-message" id="phoneError"></div>
                </div>

                <!-- 인증번호 입력 -->
                <div class="input-group" id="verificationGroup" style="display: none;">
                    <label class="input-label">인증번호</label>
                    <div class="verification-group">
                        <div class="verification-input">
                            <input type="text" class="input-field" id="verificationCode" placeholder="인증번호 6자리">
                            <div class="timer" id="timer"></div>
                        </div>
                        <button class="verify-btn" id="verifyBtn" onclick="verifyCode()">확인</button>
                    </div>
                    <div class="verified-badge" id="verifiedBadge" style="display: none;">
                        ✓ 인증완료
                    </div>
                    <div class="error-message" id="verificationError"></div>
                </div>

                <!-- 새 비밀번호 설정 섹션 -->
                <div id="passwordSection" class="disabled-section">
                    <div class="input-group">
                        <label class="input-label">새 비밀번호</label>
                        <div class="password-container">
                            <input type="password" class="input-field" id="newPassword" placeholder="새 비밀번호 (8자 이상)">
                            <button type="button" class="password-toggle" onclick="togglePassword('newPassword')">👁</button>
                        </div>
                        <div class="error-message" id="newPasswordError"></div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">비밀번호 확인</label>
                        <div class="password-container">
                            <input type="password" class="input-field" id="confirmPassword" placeholder="비밀번호를 다시 입력하세요">
                            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">👁</button>
                        </div>
                        <div class="error-message" id="confirmPasswordError"></div>
                    </div>

                    <button class="submit-btn" id="submitBtn" onclick="resetPassword()" disabled>
                        비밀번호 변경
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let timer = 0;
        let timerInterval = null;
        let isVerified = false;

        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            resetForm();
        }

        function resetForm() {
            // 모든 입력 필드 초기화
            document.getElementById('employeeId').value = '';
            document.getElementById('phoneNumber').value = '';
            document.getElementById('verificationCode').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            
            // 상태 초기화
            isVerified = false;
            clearTimer();
            
            // UI 초기화
            document.getElementById('verificationGroup').style.display = 'none';
            document.getElementById('passwordSection').classList.add('disabled-section');
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('verifiedBadge').style.display = 'none';
            
            // 에러 메시지 초기화
            clearErrors();
        }

        function clearErrors() {
            const errorElements = document.querySelectorAll('.error-message');
            errorElements.forEach(element => {
                element.textContent = '';
            });
        }

        function sendVerification() {
            clearErrors();
            
            const employeeId = document.getElementById('employeeId').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            
            if (!employeeId) {
                document.getElementById('employeeIdError').textContent = '사번을 입력해주세요.';
                return;
            }
            
            if (!phoneNumber) {
                document.getElementById('phoneError').textContent = '전화번호를 입력해주세요.';
                return;
            }
            
            if (!validatePhoneNumber(phoneNumber)) {
                document.getElementById('phoneError').textContent = '올바른 전화번호 형식이 아닙니다.';
                return;
            }
            
            // 인증번호 발송 시뮬레이션
            document.getElementById('verificationGroup').style.display = 'block';
            document.getElementById('verificationGroup').classList.add('fade-in');
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('sendBtn').textContent = '발송완료';
            
            // 입력 필드 비활성화
            document.getElementById('employeeId').disabled = true;
            document.getElementById('phoneNumber').disabled = true;
            
            startTimer();
            
            alert('인증번호가 발송되었습니다. (테스트용: 123456)');
        }

        function validatePhoneNumber(phone) {
            const phoneRegex = /^010-\d{4}-\d{4}$/;
            return phoneRegex.test(phone);
        }

        function startTimer() {
            timer = 180; // 3분
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timer--;
                updateTimerDisplay();
                
                if (timer <= 0) {
                    clearTimer();
                    document.getElementById('timer').textContent = '인증시간이 만료되었습니다.';
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timer / 60);
            const seconds = timer % 60;
            document.getElementById('timer').textContent = 
                `${minutes}:${seconds.toString().padStart(2, '0')} 남음`;
        }

        function clearTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function verifyCode() {
            const code = document.getElementById('verificationCode').value.trim();
            
            if (!code) {
                document.getElementById('verificationError').textContent = '인증번호를 입력해주세요.';
                return;
            }
            
            // 테스트용 인증번호: 123456
            if (code === '123456') {
                isVerified = true;
                clearTimer();
                
                // UI 업데이트
                document.getElementById('verificationCode').classList.add('verified');
                document.getElementById('verificationCode').disabled = true;
                document.getElementById('verifyBtn').disabled = true;
                document.getElementById('verifyBtn').textContent = '완료';
                document.getElementById('verifiedBadge').style.display = 'block';
                document.getElementById('timer').style.display = 'none';
                document.getElementById('verificationError').textContent = '';
                
                // 비밀번호 섹션 활성화
                document.getElementById('passwordSection').classList.remove('disabled-section');
                document.getElementById('passwordSection').classList.add('fade-in');
                document.getElementById('submitBtn').disabled = false;
                
            } else {
                document.getElementById('verificationError').textContent = '인증번호가 올바르지 않습니다.';
            }
        }

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const button = field.nextElementSibling;
            
            if (field.type === 'password') {
                field.type = 'text';
                button.textContent = '🙈';
            } else {
                field.type = 'password';
                button.textContent = '👁';
            }
        }

        function resetPassword() {
            if (!isVerified) {
                alert('먼저 본인 인증을 완료해주세요.');
                return;
            }
            
            clearErrors();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            let hasError = false;
            
            if (!newPassword) {
                document.getElementById('newPasswordError').textContent = '새 비밀번호를 입력해주세요.';
                hasError = true;
            } else if (newPassword.length < 8) {
                document.getElementById('newPasswordError').textContent = '비밀번호는 8자 이상이어야 합니다.';
                hasError = true;
            }
            
            if (!confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = '비밀번호 확인을 입력해주세요.';
                hasError = true;
            } else if (newPassword !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = '비밀번호가 일치하지 않습니다.';
                hasError = true;
            }
            
            if (hasError) return;
            
            // 성공 처리
            alert('비밀번호가 성공적으로 변경되었습니다.');
            closeModal();
        }

        // 모달 외부 클릭 시 닫기
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('active')) {
                closeModal();
            }
        });

        // 전화번호 자동 포맷팅
        document.getElementById('phoneNumber').addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^\d]/g, '');
            if (value.length >= 3 && value.length <= 7) {
                value = value.replace(/(\d{3})(\d+)/, '$1-$2');
            } else if (value.length > 7) {
                value = value.replace(/(\d{3})(\d{4})(\d+)/, '$1-$2-$3');
            }
            e.target.value = value;
        });
    </script>
</body>
</html>
