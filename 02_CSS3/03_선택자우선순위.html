<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택자우선순위</title>
    <style>
        h1{background-color: pink; color: yellow;}

        h1{background-color: red;}

        #id1{background-color: azure;}

        .class1 {background-color: aquamarine; color: white;}

        div{background-color: teal !important; 
            color: red;
            width: 200px; height: 200px;} /* 태그 선택자*/

    </style>
</head>
<body>

    <h1>선택자우선순위</h1>
    <p>
        기본적으로 css는 위에서부터 아래로 적용된다
        동일한 요소를 다양한 선택자로 css가 부여된 경우 우선순위에 따라 적용됨<br>

        태그 선택자 -> 클래스 선택자 -> 아이디 선택자 -> 인라인 스타일 -> !important
        

    <div id="id1" class="class1" style="background-color: plum;">우선순위테스트</div>



        

    </p>
</body>
</html>
