<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div {border: 1px solid red; box-sizing: border-box;}
        #navigator {width: 1000px; height: 40px;}

        #navi {list-style-type: none;
            padding: 0;
            margin: 0;
            height: 100%;}

        #navi>li{
            float: left;
            border: 1px solid blue;
            width: 15%;
            height: 100%;
            text-align: center;
        }

        #navi a {border: 1px solid orange;
        text-decoration: none;
    color: orange;
font-size: 18px;
font-weight: 900;
width: 100%;
height: 100%;
display: block;
line-height: 35px;}

        #navi a:hover{color: blueviolet;}

        #navi>li>ul{
            list-style-type: none;
            padding: 0;
            display: none;
        }

        #navi>li>ul a{font-size: 15px;}
        #navi>li>a:hover+ul{display: block;}
        /*ID가 navi인 메뉴에서, 리스트 항목(<li>) 안의 링크(<a>)에 마우스를 올리면, 
            그 <a> 바로 뒤에 오는 <ul> 태그(서브 메뉴)를 화면에 보이게 만든다*/
        #navi>li>ul:hover{display: block;}


    </style>
</head>
<body>

    <div id="navigator">
        <ul id="navi"> <!--(li>a)*5-->
            <li><a href="">Java</a></li>
            <li><a href="">Oracle</a></li>
            <li><a href="">Front-End</a>
                <ul>
                    <li><a href="">HTML</a></li>
                    <li><a href="">CSS</a></li>
                    <li><a href="">JavaScript</a></li>
                    <li><a href="">jQuery</a></li>
                </ul>
            </li>
            <li><a href="">Server</a>
                <ul>
                    <li><a href="">JDBC</a></li>
                    <li><a href="">Servlet</a></li>
                    <li><a href="">JSP</a></li>
                    <li><a href="">AJAX</a></li>
                </ul>
            </li>
            <li><a href="">Framework</a>
                <ul>
                    <li><a href="">myBatis</a></li>
                    <li><a href="">Spring</a></li>
                </ul>
            </li>

        </ul>

    </div>
    
</body>
</html>
