<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            border: 1px solid black;
            box-sizing: border-box;
        }

        #wrap {height: 800px; width: 1000px; margin: auto;}

        #header, #footer {height: 20%;} 
        #navigator {height: 5%;}
        #content {height: 55%;}

        #header>div, #content>div {
            float: left;
            height: 100%;
        }

        #head_1 {width: 20%;}
        #head_2 {width: 65%;}
        #head_3 {width: 15%;}


        #content_1 {width: 15%;}
        #content_2 {width: 60%;}
        #content_3 {width: 25%;}



    </style>
</head>
<body>
    <div id="wrap">
        <div id="header">
            <div id="head_1"></div>
            <div id="head_2"></div>
            <div id="head_3"></div>


        </div>

        <div id="navigator">

        </div>

        <div id="content">
            <div id="content_1"></div>
            <div id="content_2"></div>
            <div id="content_3"></div>
        </div>

        <div id="footer">

        </div>





    </div>
    
</body>
</html>
