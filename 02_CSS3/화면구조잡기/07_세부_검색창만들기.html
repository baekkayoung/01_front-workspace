<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세부 검색창 만들기-header_2</title>
    <style>
        div, form, input {border: 1px solid red; box-sizing: border-box;}
        #header_2{width: 600px; height: 150px;} /*이건 안 가져갈거임*/
        
        /*기준점 잡는 것*/
        #header_2{position: relative;}

        #search_form {width: 80%; height: 20%;}

        #search_form{/*가운데로 놓는 방법*/
            margin: auto;
            position: absolute;
            top:0;
            bottom: 0;/*서로 당기는 힘으로 극단으로 가려고 해서 결국 가운데로 위치*/
            left: 0;
            right: 0;
        }

        #search_form>div {height: 100%; float: left;}
        #search_text{width: 80%;}
        #search_btn{width: 20%;}

        #search_form input {width: 100%; height: 100%;}

    </style>
</head>
<body>
    <div id="header_2">

        <form action="" id="search_form">

            <div id="search_text">
                <input type="text" name="keyword">
            </div>

            <div id="search_btn">
                <input type="submit" value="검색">
            </div>


        </form>



    </div>
    
    
</body>
</html>
