<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    div{
        border: 1px solid red; 
        box-sizing: border-box;}

    .wrap {width: 1000px;
        height: 800px; 
        margin: auto;}

    .wrap>div {width: 100%;}

    #header {height: 15%;}
    #navigator {height: 5%;
        background-color: green;
        color: white;}
    #content {height: 70%;}
    #footer {height: 10%;}

    #header> div, #content> div
        {
            height: 100%;
            float: left;
        }

    #header_1 {width: 20%;}
    #header_2 {width: 80%;}

    /* 여기까지 표 틀*/

    #content_1, #content_3 {width: 20%;}
    #content_2 {width: 60%;}

    #navi>li {float: left;
            border: 1px solid black; height: 100%; width: 24.8%;
            text-align: center;}
    #navi {list-style-type: none;
            padding: 0; margin: 0;
            height: 100%;
            font-size: 18px;}

    /*로그인*/

    #login_form{width: 100%; height: 40%;}
    #login_form>*{width: 100%;}

    #login_input_Id_Pwd{height: 75%;}
    #login_form_etc{height: 25%; text-align: center;}

    #login_input_Id_Pwd>* {height: 100%; float: left;}
    #userIdPwd{width:70%;}
    #login_input_btn{width: 40%;}

    #login_form_etc>a {
            text-decoration: none;
            color: rgb(58, 58, 58);
            font-size: 12px;
            margin: 10px;
            vertical-align: middle;}

    #userIdPwd>input {
            width: 100%; height: 50%; 
            box-sizing: border-box;}
    #login_input_btn>input {width: 100%; height: 100%;font-size: 16px;padding: 10px;}

        

    </style>
</head>
<body>
    <div class="wrap">
        <div id="header">
            <div id="header_1">
                <img src="실습_v1/image/logo.jpg" style="width: 100%; height: 100%;">
            </div>
            <div id="header_2">
                <img src="실습_v1/image/mainlogo.jpg" style="width: 100%; height: 100%;">
            </div>
        </div>
            

        <div id="navigator">
            <ul id="navi">
                <li>Home</li>
                <li>profile</li>
                <li>Board</li>
                <li>Contact</li>
            </ul>

        </div>

        <div id="content">
            <div id="content_1">
                <img src="실습_v1/image/left_img.jpg" style="width: 100%; height: 100%;" >
            </div>
            <div id="content_2">

                <div><img src="실습_v1/image/main_img1.jpg"></div>
                <div><img src="실습_v1/image/main_img2.jpg"></div>
                <div><img src="실습_v1/image/main_img3.jpg"></div>
                <div><img src="실습_v1/image/main_img4.jpg"></div>


            </div>
            <div id="content_3">
                <div id="login_form">

                    <form action="" id="login_input_Id_Pwd">
                        <div id="userIdPwd">
                            <input type="text" name="userId" placeholder="ID를 입력하세요">
                            <input type="password" name="userPwd" placeholder="PW를 입력하세요">
                
                        </div>
                        <div id="login_form_btn">
                            <input type="submit" value="로그인">
                        </div>
                    </form>

                    <div id="login_form_etc">
                        <a href="">회원가입</a>
                        <a href="">ID/PW 찾기</a>
                    </div>
                    
                </div>
                <div id="bear">
                    <img src="실습_v1/image/right_img.jpg" >
                </div>
                <div id="chat">
                    <img src="실습_v1/image/me_chat.jpg">
                </div>
            </div>

        </div>

        <div id="footer">
            <img src="실습_v1/image/footer.JPG" style="width: 100%; height: 100%;">
            </div>
        </div>

    </div>
    
</body>
</html>
