<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <h3>* fadeIn()과 fadeOut(), fadeToggle()</h3>
    <p style="background-color: red; opacity: 0.5;">선택된 요소가 점점 투명해지면서 사라지고 점점 보여지게 해주는 메소드</p>

    <button id="test1">숨기기</button>
    <button id="test2">보여주기</button>
    <button id="test3">토글</button>

    <br><br>

    <img id="test" src="https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2FMjAyNTAxMDZfOTUg%2FMDAxNzM2MTcwMTE2MTcy.xoBMN7xo7YJ5v8B7GF_Jtq9haPphWmZEulmHeE5ZQnog.oo43NXY3Y_VDWEQovis0yfCi3YGrQoZjkBB3nd-kOqcg.JPEG%2FIMG_8053.JPG&type=sc960_832" alt="">

    <script>
        $(function(){
            $("#test1").click(function(){
                $("#test").fadeOut(2000);
            });

            $("#test2").click(function(){
                $("#test").fadeIn(2000);
            });

            $("#test3").click(function(){
                $("#test").fadeToggle(2000);
            });


              })
    </script>

</body>
</html>
