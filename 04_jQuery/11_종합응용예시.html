    <script>
        $(function(){
            $("tbody>tr").click(function(){
                //글 번호만 뽑아서 콘솔에 찍어보기
                // console.log($(this).children().eq(1).text());
                // eq-0 : tr의 어딘가를 누르면 글번호가 뜸 eq-1 : 제목

                // 현재 클릭이벤트가 발생한 해당 tr요소의 자손들(td)에 순차적으로 접근

                // $(this).children() => [td, td, td, td, td] 
                // 배열에 접근하려면 each
                $(this).children().each(function(index, el){
                    // index : 순차적으로 접근되는 인덱스의 수
                    //    el : 순차적으로 접근되는 요소 객체 (td) <= 자바스크립트 방식
                    // console.log(el); // td 태그 포함 children이 쭉 나옴
                    console.log($(el).text()) // 태그 안의 글자들만 나옴
                    $("#s" + index).text($(el).text()) // s01은 첫 td의 텍스트로..
                })

                // 상세 조회용 url 호출
                location.href = "detail.do?no="+ $(this).children().eq(0).text();

            })
        })



    </script>
